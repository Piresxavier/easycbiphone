name: EasyCB
options:
  bundleIdPrefix: fr.easycb
  deploymentTarget:
    iOS: "15.0"
targets:
  EasyCB:
    type: application
    platform: iOS
    sources:
      - EasyCB
    info:
      path: EasyCB/Info.plist
      properties:
        CFBundleDisplayName: EASY CB
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: EASY CB utilise le micro pour dicter les montants des paiements.
        NSSpeechRecognitionUsageDescription: EASY CB utilise la reconnaissance vocale pour transformer votre voix en montant.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.easycb.app
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
