name: Build EASY CB (iOS)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        run: xcodegen generate

      - name: Compiler sans signature
        run: |
          xcodebuild \
            -project EasyCB.xcodeproj \
            -scheme EasyCB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Creer l IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EasyCB.app Payload/
          zip -r EasyCB.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCB-ipa
          path: EasyCB.ipa
